name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - name: Validate installer core and direct service calls
        working-directory: installer
        run: cargo test --locked -p lyra-installer-core -p lyra-installer-service
      - name: Check Node for behavioral account-form tests
        run: node --version
      - name: Install disposable Btrfs VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio btrfs-progs e2fsprogs kmod linux-image-virtual
      - name: Qualify mount cleanup with real Btrfs, faults and cancellation
        run: |
          vm_kernel="$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n 1)"
          test -n "$vm_kernel"
          sudo install -m 0644 "$vm_kernel" "$RUNNER_TEMP/installer-mount-kernel"
          vm_version="${vm_kernel##*/vmlinuz-}"
          python3 scripts/check-installer-mount-vm.py --kernel "$RUNNER_TEMP/installer-mount-kernel" --modules-dir "/lib/modules/$vm_version"
      - name: Validate image and release contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
