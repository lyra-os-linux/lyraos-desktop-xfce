[Unit]
# A dependency failure must not create an unlimited restart/fork storm.
StartLimitIntervalSec=5min
StartLimitBurst=3

[Service]
# Leap 16.1 keeps the zlib compatibility ABI outside default library paths.
Environment=LD_LIBRARY_PATH=/usr/lib64/zlib-ng-compat
ExecStartPre=/usr/libexec/lyra-localsearch-preflight
Nice=10
CPUWeight=10
MemoryHigh=512M
MemoryMax=1G
TasksMax=64
IOWeight=10
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
